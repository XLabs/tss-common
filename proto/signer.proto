
syntax = "proto3";
package xlabs.tsscommon.service.signer;
option go_package = "./service/signer;signer";
import "google/protobuf/any.proto";
import "proto/io.proto";


service Signer {
  // SignMessage is a bidirectional streaming RPC to sign a message digest using TSS.
  // The client sends a stream of SignRequest messages containing the digest to be signed,
  // the protocol type, and the committee members involved in the signing process.
  // The server responds with a stream of SignResponse messages containing either
  // the signature data or the status (on failure).
  rpc SignMessage (stream SignRequest) returns (stream SignResponse);
}


message SignRequest {
  // A 32-byte digest to be signed.
  bytes digest = 1;
  // Defines the protocol type. E.g., ProtocolFROSTSign.ToString() (see protocol.go)
  string protocol = 2;
  // The committee members involved in the signing process. 
  // Each member should be an Ethereum address.
  repeated bytes committee = 3; 
}

message SignResponse {
  oneof response {
    // can be translated to either frost or ecdsa signature. depends on the protocol used.
    SignatureData signature = 1; // M represents the SignRequest.digest.
    SignStatus status = 2;
  }
}

message SignStatus {
  // The status code, which should be an enum value of
  // [google.rpc.Code][google.rpc.Code].
  int32 code = 1;

  // A developer-facing error message, which should be in English. Any
  // user-facing error message should be localized and sent in the
  // [google.rpc.Status.details][google.rpc.Status.details] field, or localized
  // by the client.
  string message = 2;

  // optional additional details message.
  google.protobuf.Any details = 3;
}